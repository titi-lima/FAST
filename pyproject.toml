[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-tcp"
version = "1.0.2"
description = "FAST Approaches to Scalable Similarity-based Test Case Prioritization"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Breno Miranda"},
    {name = "Emilio Cruciani"},
    {name = "Roberto Verdecchia"},
    {name = "Antonia Bertolino"},
]
maintainers = [
    {name = "Breno Miranda"},
]
keywords = ["test case prioritization", "software testing", "similarity-based", "LSH", "FAST"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6"
dependencies = [
    "scipy",
    "xxhash",
]

[project.urls]
Homepage = "https://github.com/icse18-FAST/FAST"
Documentation = "https://github.com/icse18-FAST/FAST/blob/master/README.md"
Repository = "https://github.com/icse18-FAST/FAST"
"Bug Tracker" = "https://github.com/icse18-FAST/FAST/issues"

[project.scripts]
fast-tcp = "fast_tcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fast_tcp*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
fast_tcp = ["*.txt", "*.md", "integrations/ant/*.xml"]

[project.entry-points.pytest11]
fast_tcp = "fast_tcp.integrations.pytest.plugin"